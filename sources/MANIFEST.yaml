  # --- SRC-01 (NY cap conflict) documents, plan 01-05 ---

  - path: sources/ny/2026-08-24-ny-enacted-budget-film-credit-extract.pdf
    url: https://legislation.nysenate.gov/pdf/bills/2025/S3009C
    retrieved_at: "2026-08-24T23:24:00-07:00"
    sha256: "8ce03a1d3d4a0d9c7e658dc7e48eb769adf6174d6c1593531da4ad7f7b07ba1d"
    jurisdiction: us-ny
    document_title: "S. 3009--C / A. 3009--C, the 2025-2026 New York State Revenue Budget Bill (signed into law as Chapter 59 of the Laws of 2025 on 2025-05-09), full text as printed by the NY State Senate"
    note: >
      The enacted statutory text — top of the D2/PITFALLS.md precedence
      ordering, and neither of the two ESD PDFs below is itself the statute.
      Fetched directly from the NY Senate's own bill-PDF endpoint
      (legislation.nysenate.gov), which serves the official print without
      the Cloudflare bot-verification challenge that blocked direct access
      to www.nysenate.gov/legislation/laws/TAX/24 this session (see
      SOURCE-TRUTH.md SRC-01 for the access-method note). Part I, Section 3
      (amending Tax Law section 24(e)(4), "Additional pool 2") shows the
      $700,000,000/year base-program figure UNCHANGED — only the sunset
      year is amended, from "[thirty-four]" (2034) to "thirty-six" (2036).
      Part I, Section 9 adds new Tax Law section 24-d, the Empire State
      Independent Film Production Credit, at $20,000,000/year (sub-$10M
      qualified-cost productions) plus $80,000,000/year (>=$10M), summing
      to $100,000,000/year — confirmed directly from the enacted bill text,
      not from ESD's paraphrase of it.
    cited_for:
      - "SRC-01 — SOURCE-TRUTH.md entry: closes the $700M/$800M conflict against the enacted statute"

