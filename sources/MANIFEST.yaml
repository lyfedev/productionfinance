# `path` is repo-relative and `sha256` is computed over the exact bytes
# archived at `path` — re-hashing the file must reproduce the recorded value.
# A substituted or altered document is detectable by re-hashing; do not
# hand-edit a `sha256` value without re-deriving it from the file.

