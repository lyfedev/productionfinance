  - path: sources/ca/2026-09-09-leginfo-rtc-17053-98-1.html
    url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=RTC&sectionNum=17053.98.1"
    retrieved_at: "2026-09-09T01:33:45-07:00"
    sha256: "7df6806984af71f93d7c2b08246ba9b4ea2bcfb8685017803c48bab155ebc9ea"
    jurisdiction: us-ca
    document_title: "California Revenue and Taxation Code Section 17053.98.1 — Film and Television Tax Credit Program 4.0 (personal income tax mirror), leginfo.legislature.ca.gov"
    note: >
      Fetched by direct curl from the California Legislature's own bill-text
      site. THIS, not RTC 17053.98 (the Program 3.0 statute, superseded for
      credits allocated on or after 2026-07-01 -- 2026-08-24's session
      initially fetched 17053.98 on the plan's own suggestion and found it
      states 20%/25% base rates, not the 35%/40% film.ca.gov's live page
      displays; RTC 17053.98.1 is the correct, current Program 4.0 statute,
      "for taxable years beginning on or after January 1, 2025" with
      credits "in no instance prior to July 1, 2025" -- see the header
      comment in jurisdictions/us-ca.yaml for the full resolution, styled on
      SOURCE-TRUTH.md SRC-01's precedent for a stale-vs-current source
      conflict), confirms directly and in statute text: subdivision (a)(4)
      the applicable credit percentage is 35% for a feature/TV
      series/mini-series in its second-or-subsequent year (or any
      non-relocating qualified motion picture) and 35% for an independent
      film, 40% for a relocating TV series in its first California season;
      subdivision (a)(3)(B) the per-project caps ($120,000,000 for
      feature/miniseries/TV series per season, $20,000,000 for an
      independent film); subdivision (i)(1)(A) the $750,000,000/fiscal-year
      aggregate allocation cap; subdivision (a)(19) "qualified motion
      picture" requires a $1,000,000 minimum production budget; subdivision
      (a)(17) "qualified expenditures" means amounts paid for tangible
      personal property used, and services performed, WITHIN California
      (a plain total-qualified-spend definition, matching
      jurisdictions/us-ny.yaml and jurisdictions/us-ct.yaml's
      base_definition.type); subdivision (a)(22)(B)(iv) above-the-line
      wages for writers, directors, music directors/composers/supervisors,
      producers and performers (other than unscripted background actors)
      are excluded from "qualified wages" ENTIRELY — a categorical
      exclusion, not the PerPersonCeiling schema's W-2-cap-with-loan-out-
      exemption model (same class of schema mismatch CT's star-talent
      exclusion already established, see jurisdictions/us-ct.yaml); the
      default mechanism is a NONREFUNDABLE credit against "net tax" with an
      8-year carryover (subdivision (c)(3)), with an independent film's
      credit alone sellable once to one unrelated party (subdivision
      (c)(1)-(4), no resale) and a separate one-time elective PARTIAL refund
      option available to any category (subdivision (k): 20% of a "total
      refundable amount" -- itself 90% of the excess credit over net tax --
      paid out per year across a 5-year "refundable period") — neither this
      schema's `refundable` nor `transferable` Literal cleanly names this
      elect-to-partially-refund-at-a-haircut structure, so
      jurisdictions/us-ca.yaml declares `mechanism: nonrefundable_credit`
      (the closest of the four Literal values to "credit against tax
      liability by default, sellable/refundable only by a separate,
      non-default election") and documents the full mechanism in its header
      comment and rate_structure.source_note rather than picking a
      Literal that silently overstates monetizability. Establishes
      audit requirements as a precondition to credit-certificate issuance
      (subdivision (g)) with no dollar fee schedule stated.
    cited_for:
