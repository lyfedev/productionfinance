# deploy/prodfin-finance-location.conf
#
# Reviewable copy of the Apache directives added to the LIVE vockell.com
# vhost to reverse-proxy https://vockell.com/finance to ProductionFinance.
#
# THIS FILE IS NOT INCLUDED BY APACHE. It is not installed on the host and
# Apache never reads it. Plan 01-09 (as originally written) called for a
# brand-new `deploy/prodfin-vhost.conf` installed as a standalone vhost file
# on a dedicated subdomain. That approach was superseded by the D-14
# path-mount decision recorded in 01-06-SUMMARY.md and deploy/README.md:
# the public URL is a PATH on the EXISTING vockell.com site, not a new
# subdomain, so there is no new vhost to install — the directives below
# were instead added directly, by hand, inside the existing live vhost
# file on the host:
#
#   /opt/bitnami/apache/conf/bitnami/bitnami-ssl.conf
#   (the "<VirtualHost _default_:443>" block — the one vhost that answers
#   for vockell.com, terminating TLS with the site's own existing
#   Let's Encrypt certificate; no new certificate was issued)
#
# This file exists purely so that exact host edit is reviewable in the
# public repo (the same goal the original deploy/prodfin-vhost.conf
# artifact served), without misrepresenting it as a file Apache actually
# loads. See deploy/README.md "Apache path mount (plan 01-09 revision)"
# for the full record: backup paths, configtest output, the graceful
# reload, and external verification.
#
# --- Directives added inside <VirtualHost _default_:443> ---
#
# 1. One RewriteCond added to the vhost's existing "Enable non-www to www
#    redirection" rule, immediately after the pre-existing /.well-known
#    exclusion (same pattern, same style — /finance opts out of the
#    apex-to-www redirect exactly the way ACME challenges already did):
#
#   RewriteCond %{REQUEST_URI} !^/finance
#
#    Without this line, https://vockell.com/finance/* is unconditionally
#    301-redirected to https://www.vockell.com/finance/* by the existing
#    rule below it — and www.vockell.com does not currently resolve (see
#    deploy/README.md "Known pre-existing redirect", carried from
#    01-08-SUMMARY.md). This one line is the entire reason /finance was
#    unreachable before this plan, discovered live during Task 1's
#    verification pass, not assumed in advance.
#
# 2. A new block, added directly after the redirection rule's END comment:
#
#   ProxyPreserveHost On
#   ProxyPass /finance http://127.0.0.1:8000
#   ProxyPassReverse /finance http://127.0.0.1:8000
#
#    Note the target has NO trailing slash, deliberately, unlike the
#    original plan's `http://127.0.0.1:<port>/` pattern (written for a
#    subdomain vhost proxying "/" with a trailing-slash target, which is
#    correct for that shape). For a path-prefix ProxyPass with a
#    non-trailing-slash Local pattern ("/finance"), a trailing slash on
#    the target produces a doubled slash on every proxied request
#    (`/finance/health` -> `http://127.0.0.1:8000//health`, which
#    uvicorn/Starlette 404s on as a distinct path from `/health`) — this
#    was caught live during Task 1's own external verification pass
#    (curl returned 404 with `Server: uvicorn`, proving the proxy reached
#    the app but mapped the path wrong), fixed immediately, and
#    re-verified before Task 1 was called done. See deploy/README.md for
#    the exact repro.
#
# --- Full context: the vhost this was added to also already contains ---
# - SSLCertificateFile/SSLCertificateKeyFile pointing at the vockell.com
#   Let's Encrypt certificate (SANs: vockell.com, www.vockell.com) — reused
#   as-is, untouched by this plan.
# - The existing /.well-known ProxyPass exclusion and Location block,
#   supporting the SITE'S OWN certificate renewal — untouched.
# - The existing non-www redirect rule for every other path — untouched,
#   still redirects to https://www.vockell.com/... exactly as before.
