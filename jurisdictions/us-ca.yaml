programmes:
  - id: ca-film-television-tax-credit-program
    name: "California Film & Television Tax Credit Program 4.0 — Feature Film, New TV Series, Mini-Series, Pilots"
    requires_separate_application: false
    stacks_with: []
    mutually_exclusive_with: []

    mechanism: nonrefundable_credit
    taxable: false
    corporation_tax_rate: null

    base_definition:
      type: total_qualified_spend
      pct_core_cap: null
      excluded_line_items: []
      custom_handler_id: null

    per_person_ceiling:
      applies: false
      note: "RTC 17053.98.1(a)(22)(B)(iv): above-the-line wages paid per person per production for writers, directors, music directors, music composers, music supervisors, producers, and performers (other than background actors with no scripted lines) are excluded from 'qualified wages' entirely — a categorical role-based exclusion built into the statutory definition of qualified expenditures itself, NOT this schema's W-2-cap-with-loan-out-exemption PerPersonCeiling model (same class of schema mismatch as jurisdictions/us-ct.yaml's star-talent exclusion). base_definition.excluded_line_items is left empty rather than naming this exclusion there: that field subtracts a named, dollar-valued line item from a SpendBreakdown that actually carries one (engine/qualifying_base.py::_apply_excluded_line_items looks the name up in SpendBreakdown.line_items and raises KeyError if absent) — neither committed CA fixture discloses a per-role wage breakdown to subtract, only a single total qualified_spend figure, so there is no line-item value to name here without inventing one. Not modeled quantitatively; disclosed here in prose instead."
      w2_cap_amount: null
      loanout_exempt: null
      loanout_withholding_rate: null
      loanout_withholding_confirmed: null
      loanout_withholding_schedule: []

    rate_structure:
      type: flat
      base_rate: "0.35"
      tiers: []
      uplifts: []
      ceiling_split: null
      headcount_scale: null
      source_note: >
        35% confirmed directly and identically by two independent primary
        sources: film.ca.gov's own "The Basics 4.0" page (rendered via a
        client-side Divi "number counter" widget, data-number-value="35",
        paired with the "Feature Film, New TV Series, Mini-Series, Pilots"
        toggle) and RTC 17053.98.1(a)(4)(A)/(C) ("Thirty-five percent of the
        qualified expenditures attributable to the production of a
        qualified motion picture in California... [or] that is an
        independent film"). Re-derived against both committed fixtures:
        Clueless S1 ($46,522,000 qualified spend x 0.35 = $16,282,700
        against a disclosed $16,335,000 — residue $52,300, 11.24 bps of
        disclosed spend) and Disney's Hexed ($47,538,000 x 0.35 =
        $16,638,300 against a disclosed $16,638,000 — residue $300, 0.06
        bps) — both comfortably inside each fixture's declared
        tolerance_bps of 50. The small residues are consistent with the
        uplift categories this file deliberately does NOT declare (see the
        file's header comment) applying to an unknown, unitemized fraction
        of each production's spend, not with the base rate being wrong.

    minimum_spend:
      value: "1000000"
      currency: USD

    caps:
      per_project_cap:
        value: "120000000"
        currency: USD
      annual_programme_cap:
        amount:
          value: "750000000"
          currency: USD
        period: fiscal_year
        escalator_schedule: null
      cap_consumption_check:
        method: live_research
        source_url: null

    audit:
      mandatory: true
      fee_schedule: []

    timing:
      terms_lock_at: application
      application_window: null
      decision_sla_days: null
      payout_lag:
        description: "RTC 17053.98.1(a) makes this a nonrefundable credit against 'net tax' with an 8-year carryover (subdivision (c)(3)) by default — no statutory cash-arrival lag applies to the default path. A qualified taxpayer may separately elect (subdivision (k), one-time, irrevocable) a partial refund paid at 20% of a 'total refundable amount' (itself 90% of the excess over net tax) per year across a 5-year refundable period; no single typical_days figure describes either path honestly, so this stays an explicit null rather than an invented number."
        typical_days: null
        interest_paid: null

    transfer_discount:
      applies: false
      typical_rate_low: null
      typical_rate_high: null
      source_note: "This programme's mechanism is nonrefundable_credit, not transferable — RTC 17053.98.1(c)(1) reserves credit sale to the Independent Films track, which this file does not model (see header comment)."

    residency_rules: null

    validation:
      validated: true
      validation_pair_fixture_glob: "tests/fixtures/validation_pairs/ca_*.yaml"
      mean_error_pct: null
      last_checked_against_disclosure: "2026-09-09"
