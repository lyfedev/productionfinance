# California — Film & Television Tax Credit Program 4.0 (curated, validated)
#
# Every numeric value below is a quoted YAML string (RD-01: PyYAML parses an
# unquoted decimal like 0.35 as a native float, which corrupts through naive
# Decimal() conversion — engine/models.py types every such field Decimal and
# requires the quoted-string convention).
#
# This file models ONE of California Program 4.0's three rate tracks: the
# "Feature Film, New TV Series, Mini-Series, Pilots" (non-independent, non-
# relocating) track — the only track either committed California validation
# pair (Clueless S1, Disney's Hexed — both classified "Non-Independent" in
# the CA Film Commission's own approved-projects disclosure) needs. It
# deliberately does NOT model:
#   - The "Relocating TV Series" track (40% first CA season, reduced to 35%
#     for the second and subsequent seasons). A single rule-file programme
#     cannot express a rate that depends on which numbered season a specific
#     production is in — RateStructure has no "season count" input anywhere
#     in engine/models.py or engine/credit.py. Encoding it here would need a
#     schema extension (a new dispatch dimension keyed on
#     production-specific season data), which is out of this plan's
#     files_modified. Left unmodeled, not silently guessed.
#   - The "Independent Films" track (35%, min budget $1,000,000, credit
#     capped at the first $20,000,000 of qualified expenditures, AND — per
#     RTC 17053.98.1(c) — sellable once to one unrelated party, in addition
#     to the same elective partial-refund option every track carries). This
#     track's real mechanism is genuinely dual (sell OR elect the partial
#     refund, producer's choice) in a way this schema's single-value
#     `mechanism` Literal cannot express without picking one and silently
#     hiding the other. Left unmodeled rather than guessed at.
#   - The Out-of-Zone Filming (+5%), Visual Effects (+5%) and Local Hire
#     Labor (+10%/+5%) uplifts. All three are real, sourced, additive rates
#     (sources/ca/2026-09-09-film-ca-gov-tax-credit-the-basics-4-0.html) —
#     but `engine.credit._apply_uplift_stacking` applies every declared
#     stackable uplift UNCONDITIONALLY to every production priced through
#     this programme, and neither committed fixture's disclosure itemizes
#     which uplift categories (if any) Clueless S1 or Disney's Hexed
#     claimed. Declaring them here would silently apply an unclaimed uplift
#     to every future production priced against this file. Not declared —
#     see rate_structure.source_note below, and see the two fixtures'
#     assertion.variance_reason for the same residue named on the data side.
#
# Two sources back the rate-and-cap figures in this file:
#   1. film.ca.gov's own "The Basics 4.0" page
#      (sources/ca/2026-09-09-film-ca-gov-tax-credit-the-basics-4-0.html) —
#      the administering agency's live, current program summary.
#   2. California Revenue and Taxation Code Section 17053.98.1 (Personal
#      Income Tax Law mirror) and Section 23698.1 (Corporation Tax Law
#      mirror — the statute a corporate qualified taxpayer, which both
#      fixtures' productions are, actually claims the credit under),
#      fetched directly from leginfo.legislature.ca.gov
#      (sources/ca/2026-09-09-leginfo-rtc-17053-98-1.html and
#      sources/ca/2026-09-09-leginfo-rtc-23698-1.html) — the codified law
#      itself, independently confirming every figure film.ca.gov states.
#
# RESOLVED SOURCE CONFLICT (styled on SOURCE-TRUTH.md SRC-01's precedent for
# a stale-vs-current tension): this session's FIRST fetch, of RTC 17053.98
# alone (the statute this plan's own Task 1 text names), states an
# "applicable credit percentage" of 20 percent or 25 percent — Program 3.0's
# rate structure, not Program 4.0's. Reading further, RTC 17053.98
# subdivision (k) (a DIFFERENT provision — the Soundstage Filming Tax Credit
# for productions at a certified studio-construction project) itself points
# to "Section 17053.98.1" for credits allocated on or after July 1, 2025.
# RTC 17053.98.1 is the correct, current, general Program 4.0 statute: it
# states "35 or 40 percent" directly, in force "for taxable years beginning
# on or after January 1, 2025" with credits allowed "in no instance prior to
# July 1, 2025" — exactly matching both fixtures' Credit Allocation Dates
# (6/22/2026 and 7/27/2026) and film.ca.gov's live-page rates. RTC 17053.98.1
# is what this file cites; RTC 17053.98 alone would have been the wrong,
# superseded statute for a 2026 allocation.
#
# Also disclosed rather than guessed: California's REAL mechanism is not a
# clean match for any single value in this schema's closed `mechanism`
# Literal. RTC 17053.98.1(a) makes the credit a NONREFUNDABLE credit against
# "net tax" by default, with an 8-year carryover (subdivision (c)(3)). A
# qualified taxpayer MAY separately elect (subdivision (k), a one-time,
# irrevocable election) to be paid a partial refund: 20 percent of a "total
# refundable amount" — itself 90 percent of the credit's excess over net tax
# in the first refundable year — per year, across a 5-year "refundable
# period". That is neither this schema's `refundable` (a single, complete
# cash conversion) nor its `transferable` (an open-market sale — reserved,
# per RTC 17053.98.1(c)(1), to the Independent Films track only, which this
# file does not model) — it is a nonrefundable credit against tax liability
# with a slower, partial, elective cash-out option. `mechanism:
# nonrefundable_credit` is the closest of the four Literal values to that
# reality and is what this file declares; `engine.net_cash.nonrefundable_credit`
# deducts the (here, undeclared/zero) audit fee and, since `taxable: false`,
# converts the remainder to net cash directly — which describes the
# straightforward carryover-credit-against-liability case, not the slower
# elective 5-year partial refund a real producer might actually choose. This
# is a real simplification, disclosed here rather than a silent one.

