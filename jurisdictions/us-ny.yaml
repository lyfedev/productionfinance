# New York — Film Production Tax Credit (curated, validated)
#
# Every numeric value below is a quoted YAML string (RD-01: PyYAML parses an
# unquoted decimal like 0.25 as a native float, which corrupts through naive
# Decimal() conversion — engine/models.py types every such field Decimal and
# requires the quoted-string convention).
#
# This file models the base Film Production and Post-Production Tax Credit
# Program (Tax Law section 24) only. It deliberately does NOT model:
#   - New York's separate $100M Empire State Independent Film Production
#     Credit (Tax Law 24-d) — its $20M/$80M pool split is confirmed
#     (SOURCE-TRUTH.md SRC-01) but its rate is not confirmed against a
#     primary source, and encoding an unsourced rate is forbidden.
#   - New York's diversity and equity bonus credit — disclosed in the source
#     data (diversity_credit_amount in the validation-pair fixtures) but not
#     itemized; assertions are made against credit_amount alone.
# See jurisdictions/SCOPE-FREEZE.md for the full, dated list of disclosed
# simplifications.

