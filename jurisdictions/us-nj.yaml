    - url: "https://pub.njleg.gov/Bills/2018/PL18/56_.PDF"
      title: "P.L. 2018, c. 56 — the Garden State Film and Digital Media Jobs Act (New Jersey Legislature, original enacted text)"
      accessed_date: "2026-09-09"
      confidence: HIGH
    - url: "https://www.state.nj.us/treasury/taxation/digitalmediajobs.shtml"
      title: "Garden State Film and Digital Media Jobs Act Credit FAQs (New Jersey Division of Taxation)"
      accessed_date: "2026-09-09"
      confidence: HIGH
    - url: "https://www.njeda.gov/wp-content/uploads/2026/05/Film-Tax-Credit-Transfer-App-REV.3.24.pdf"
      title: "Film Tax Credit Transfer Application (New Jersey Economic Development Authority)"
      accessed_date: "2026-09-09"
      confidence: HIGH

programmes:
  - id: nj-garden-state-film-digital-media-jobs-program
    name: "New Jersey Garden State Film and Digital Media Jobs Program — Film Tax Credit (applications received prior to 2021-01-07, outside the eight South Jersey counties)"
    requires_separate_application: false
    stacks_with: []
    mutually_exclusive_with: []

    mechanism: transferable
    taxable: false
    corporation_tax_rate: null

    base_definition:
      type: total_qualified_spend
      pct_core_cap: null
      excluded_line_items: []
      custom_handler_id: null

    per_person_ceiling:
      applies: false
      note: "N.J.A.C. 19:31T-1.2's definition of 'Qualified film production expenses', subparagraph (g), excludes payment in excess of $750,000 to a highly compensated individual (writers, directors including music directors, producers, and performers other than background actors with no scripted lines) from qualifying expenses — with further, studio-partner-status-dependent carve-out allowances of up to an additional $18,000,000 or $72,000,000 depending on total qualified spend. This is a categorical, tiered exclusion cliff built into the statutory expense definition itself, NOT this schema's W2-cap-with-loan-out-exemption PerPersonCeiling model (the same class of schema mismatch jurisdictions/us-ca.yaml and jurisdictions/us-ct.yaml already document for their own categorical wage exclusions). Not modeled quantitatively; disclosed here in prose instead. Neither committed New Jersey fixture discloses a per-role wage breakdown in any case — only a single total qualified_spend figure."
      w2_cap_amount: null
      loanout_exempt: null
      loanout_withholding_rate: null
      loanout_withholding_confirmed: null
      loanout_withholding_schedule: []

    rate_structure:
      type: flat
      base_rate: "0.30"
      tiers: []
      uplifts: []
      ceiling_split: null
      headcount_scale: null
      source_note: >
        30% confirmed identically by two independent primary sources at
        the tier both committed fixtures need: N.J.A.C. 19:31T-1.6(a)(2)
        ("For completed applications received prior to January 7, 2021,
        30 percent of the qualified film production expenses not included
        at (a)1 above [the South-Jersey-vendor 35% bonus], including
        qualified wage and salary payments") and P.L. 2018, c. 56 Section 1
        (the original enacting text, identical figure, confirming the
        codified regulation has not drifted from the enacting statute for
        this tier). This file deliberately does NOT declare the 2 percent
        diversity-plan bonus as an uplift here — see the file's header
        comment and rate_structure's absence of an uplifts entry — so the
        residue it produces on the one fixture that claimed it (Joker) is
        asserted as an exact, named, sourced Decimal quantity in
        tests/test_jurisdiction_us_nj.py, not silently folded into this
        rate. Re-derived against both committed fixtures: The Trial of the
        Chicago 7 ($17,906,613 qualified spend x 0.30 = $5,371,983.90,
        quantized ROUND_HALF_UP to $5,371,984) reproduces the disclosed
        Total Award of $5,371,984 EXACTLY (no diversity bonus claimed on
        this row) — zero residue. Joker ($6,133,257 x 0.30 = $1,839,977.10,
        quantized to $1,839,977) computed against the disclosed Total
        Award of $1,962,642 leaves a residue of exactly $122,665 — which
        equals quantize($6,133,257 x 0.02) = $122,665, the sourced 2
        percent diversity bonus this fixture's Diversity Bonus flag
        discloses as "Yes", asserted as an exact Decimal equality in
        tests/test_jurisdiction_us_nj.py, not a tolerance.

    minimum_spend:
      value: "1000000"
      currency: USD

    caps:
      per_project_cap: null
      annual_programme_cap:
        amount:
          value: "100000000"
          currency: USD
        period: fiscal_year
        escalator_schedule: null
      cap_consumption_check:
        method: live_research
        source_url: null

    audit:
      mandatory: true
      fee_schedule: []

    timing:
      terms_lock_at: application
      application_window: null
      decision_sla_days: null
      payout_lag:
        description: "N.J.A.C. 19:31T-1.6(n): unused tax credit may be carried forward, if necessary, to the seven privilege periods or taxable years following the year for which it was allowed — the path a producer takes if it never elects the transfer certificate below. No statutory cash-arrival day-count applies to either the carryforward-against-liability path or the elective transfer-certificate sale; a real transfer's timing depends on when a buyer is found, which this session's sources do not state as a fixed lag. typical_days stays an explicit null rather than an invented number."
        typical_days: null
        interest_paid: null

    transfer_discount:
      applies: true
      typical_rate_low: "0.75"
      typical_rate_high: null
      source_note: >
        N.J.A.C. 19:31T-1.10(b), P.L. 2018, c. 56 Section 1(e), and
        NJEDA's own Film Tax Credit Transfer Application form all
        independently state that a sale or assignment of the tax credit
        "shall not be exchanged for consideration received by the
        approved applicant of less than 75 percent of the transferred
        credit amount" (the application form states the identical figure
        in plain operational terms: "Sales must be for a value of $.75 on
        the dollar or [above]"). This is a sourced FLOOR — the legal
        minimum a seller may accept — not a full disclosed market range.
        No New Jersey government document located this session states a
        ceiling; a credit's real-world sale price above the 75-cent floor
        is not disclosed anywhere searched. Inventing "1.00" (par) as the
        ceiling would be exactly the plausible-but-unsourced figure D-87
        forbids, so typical_rate_high stays an explicit null.
        engine.net_cash.transferable requires BOTH bounds declared
        before it will convert and therefore correctly refuses to convert
        for every New Jersey pair — this is a deliberate honesty gate, not
        a bug, asserted directly (not routed around) by
        tests/test_jurisdiction_us_nj.py, mirroring
        jurisdictions/us-ct.yaml's identical, already-established pattern
        (WINDOWS.md entry #3).

    residency_rules: null

    validation:
      validated: true
      validation_pair_fixture_glob: "tests/fixtures/validation_pairs/nj_*.yaml"
      mean_error_pct: null
      last_checked_against_disclosure: "2026-09-09"
