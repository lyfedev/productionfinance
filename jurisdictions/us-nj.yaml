# New Jersey — Garden State Film and Digital Media Jobs Program (curated, validated)
#
# Every numeric value below is a quoted YAML string (RD-01: PyYAML parses an
# unquoted decimal like 0.30 as a native float, which corrupts through naive
# Decimal() conversion — engine/models.py types every such field Decimal and
# requires the quoted-string convention).
#
# This file models ONE tier of the film-credit rate schedule at N.J.A.C.
# 19:31T-1.6(a): "For completed applications received prior to January 7,
# 2021, 30 percent of the qualified film production expenses not included
# at (a)1 above [the South-Jersey-vendor bonus], including qualified wage
# and salary payments." This is the ONLY tier either committed New Jersey
# validation pair needs — both were approved well before that date (Joker,
# 08/13/2019; The Trial of the Chicago 7, 07/14/2020) and neither
# production's expenses were incurred through vendors in the eight South
# Jersey counties the (a)(1) bonus names (Joker: Newark, Essex County;
# Chicago 7: Paterson, Passaic County). It deliberately does NOT model:
#   - The South-Jersey-vendor 35% bonus rate at N.J.A.C. 19:31T-1.6(a)(1)
#     (a per-vendor-location rate, not a flat programme-wide one — no
#     committed fixture's disclosure itemizes vendor location).
#   - The CURRENT (post-July-2-2021) rate structure at N.J.A.C.
#     19:31T-1.6(a)(4) — a genuinely different, NYC-metro-zone-dependent,
#     studio-partner/film-lease-production-company-dependent schedule
#     (30-40%, several sub-tiers). Neither committed fixture's application
#     was received in this window; encoding it here would misrepresent a
#     THIRD production's rate as though it applied to Joker or Chicago 7.
#   - The Digital Media Content Production credit (a separate credit,
#     20-40% depending on application date and post-production location —
#     neither committed fixture is a digital-media production).
#   - The post-June-30-2025 "promote New Jersey" bonus (4%, up to +5%
#     aggregate with the diversity bonus) and the "economically
#     disadvantaged area" bonus (4%) at N.J.A.C. 19:31T-1.6(o)(3)-(5) —
#     both postdate either fixture's 2019/2020 approval by years and
#     require plans/criteria no 2019/2020 application could have filed.
#   - The highly-compensated-individual $750,000-per-person qualifying-wage
#     ceiling at N.J.A.C. 19:31T-1.2's "Qualified film production expenses"
#     definition, subparagraph (g). This is a categorical, tiered-by-
#     studio-partner-status exclusion cliff (with several carve-out
#     schedules up to $18M/$72M in additional allowed wages depending on
#     total spend), NOT this schema's W2-cap-with-loan-out-exemption
#     PerPersonCeiling model (same class of schema mismatch California's
#     and Connecticut's per_person_ceiling.note already document for their
#     own categorical wage exclusions). Neither committed fixture discloses
#     a per-role wage breakdown to apply it against in any case.
#   - Studio-partner and film-lease-production-company designations, their
#     separate (larger) annual cap carve-outs, and the seven promotional
#     criteria at N.J.A.C. 19:31T-1.6(o)(4) — neither fixture's production
#     company (WB Studio Enterprises Inc., C7 Production Inc.) is disclosed
#     as holding either designation.
#
# Also disclosed rather than guessed: the diversity-plan bonus at N.J.A.C.
# 19:31T-1.6(o)(1) — "an amount equal to two percent of the qualified film
# production expenses" for a completed application accompanied by an
# approved diversity plan (15 percent minority/women hiring goal for
# applications approved prior to February 26, 2024 — both fixtures'
# approval dates qualify; confirmed at original enactment too, P.L. 2018,
# c. 56, Section 4a, for privilege periods commencing July 1, 2018 through
# June 30, 2023) — is claimed by SOME New Jersey productions and not
# others. The Joker/Trial-of-the-Chicago-7 disclosure itself publishes it
# as a per-row Yes/No flag (Joker: Yes; Chicago 7: No), production-specific
# data the rule file does not and cannot carry. Declaring it as an
# `uplifts` entry would apply engine.credit._apply_uplift_stacking's
# unconditional stacking to every production priced through this file,
# including ones that never claimed it — a modelling error, not
# conservatism (the same reasoning jurisdictions/us-ca.yaml's header
# applies to its own three unclaimed uplift categories). The base
# percentage (0.30) is modeled in rate_structure; the diversity bonus is
# named here, sourced, quantified, and left OUT of rate_structure.uplifts
# so tests/test_jurisdiction_us_nj.py can assert the exact residue it
# produces on the one committed pair that claimed it (Joker) as a Decimal
# equality, not absorb it into a widened tolerance:
#   Sourced bonus rate: 0.02 (two percent), N.J.A.C. 19:31T-1.6(o)(1) and
#   P.L. 2018, c. 56 Section 4a (both independently confirm the identical
#   figure, at enactment and in the current codified regulation).
#
# Three sources back the rate-and-cap figures in this file:
#   1. N.J.A.C. Title 19, Chapter 31T — the current New Jersey
#      Administrative Code implementing the Garden State Film and Digital
#      Media Jobs Act, hosted by the administering agency itself
#      (sources/nj/2026-09-09-njeda-nj-a-c-19-31t-garden-state-film-digital-media-jobs-program.pdf).
#   2. P.L. 2018, c. 56 — the original enacting Act, fetched directly from
#      the New Jersey Legislature's own bill-publication host
#      (sources/nj/2026-09-09-njleg-pl2018-c56-garden-state-film-digital-media-jobs-act.pdf)
#      — independently confirms the base rate, diversity bonus, minimum
#      spend and transfer floor AT THE TIME both fixtures' applications
#      were received, closing the possibility that the current codified
#      regulation drifted from the enacting statute for this tier (it has
#      not: every figure below is identical in both documents).
#   3. New Jersey Division of Taxation's own Garden State Film and Digital
#      Media Jobs Act Credit FAQ (state.nj.us), a third independent
#      government source
#      (sources/nj/2026-09-09-nj-treasury-division-of-taxation-film-credit-faq.html)
#      — corroborates the annual cap, the absence of any per-project cap
#      ("there is not an annual limit on an individual project"), the
#      7-year carryforward, and the mandatory CPA verification report.
#   4. NJEDA's own tax-credit-transfer application form
#      (sources/nj/2026-09-09-njeda-film-tax-credit-transfer-app.pdf) — a
#      fourth, plain-language restatement of the transfer floor ("Sales
#      must be for a value of $.75 on the dollar or [above]").
#
# HISTORICAL CAP NOTE (disclosed, not a conflict requiring resolution,
# styled on the CA/NY precedent for a stale-vs-current figure): P.L. 2018,
# c. 56's original annual film-credit cap was $75,000,000/fiscal-year for
# fiscal years 2019 through 2023 (Section 1(e)(1)) — since raised to the
# $100,000,000/fiscal-year figure the current N.J.A.C. 19:31T-1.11(a)(1)
# states (this file's declared figure), by a later amendment this session
# did not need to individually date, because RD-04 makes the annual
# programme cap never affect a per-project gross-credit computation: cap
# EXISTENCE is rule data, cap CONSUMPTION is a separate, live concern
# (jurisdictions/SCOPE-FREEZE.md dimension 6). Which historical figure was
# in force on either fixture's approval date is therefore immaterial to
# reproducing its disclosed credit; the current, live figure is what this
# file declares.
#
# MECHANISM CHOICE (transferable, not nonrefundable_credit — a deliberate
# departure from jurisdictions/us-ca.yaml's precedent, not an inconsistency):
# N.J.A.C. 19:31T-1.6(a) states the credit as, by default, "a credit
# against the tax imposed" — the same nonrefundable-credit-against-
# liability shape California's Program 4.0 has. But N.J.A.C. 19:31T-
# 1.10(a) states the transfer right applies to "tax credits, upon receipt
# thereof by an approved applicant" generally, "IN LIEU OF the approved
# applicant being allowed any amount of the credit against [its own] tax
# liability" — a broadly available elective alternative for THIS SAME
# programme, not restricted to a track this file excludes (contrast
# California's Program 4.0, where sale is reserved by statute to the
# Independent Films track alone, a track jurisdictions/us-ca.yaml
# deliberately does not model — which is why that file correctly declares
# nonrefundable_credit instead). New Jersey's transfer right's breadth,
# and its statutory phrasing ("may be transferred, by sale or assignment,
# in full or in part"), closely mirrors jurisdictions/us-ct.yaml's
# Connecticut statute ("may be sold, assigned or otherwise transferred, in
# whole or in part") — declared transferable there for the identical
# reasoning. transferable is the more honest single-value characterization
# of how a real New Jersey film-credit holder actually converts this
# credit to cash, and is what this file declares.
#
# TRANSFER DISCOUNT (the known landmine, resolved here with a genuine
# partial source rather than either an invented full range or a wholly
# unsourced null pair): N.J.A.C. 19:31T-1.10(b), P.L. 2018 c. 56 Section
# 1(e), and NJEDA's own transfer-application form all state, in three
# independent primary documents, that a sale of the tax credit "shall not
# be exchanged for consideration ... of less than 75 percent of the
# transferred credit amount" — a sourced FLOOR (typical_rate_low: 0.75).
# No document anywhere in this session's search states a CEILING — the
# statute imposes a legal minimum price, not a full disclosed market
# range, and no NJ government publication states what fraction of face
# value transactions actually clear at above that floor. Inventing "1.00"
# (par, no discount) as the ceiling would be exactly the plausible-but-
# unsourced number D-87 forbids, even though it is definitionally the
# maximum any credit could rationally sell for. typical_rate_high therefore
# stays an explicit null. engine.net_cash.transferable requires BOTH bounds
# to be non-null before it will convert, so it correctly refuses for every
# New Jersey pair exactly as it already does for Connecticut
# (jurisdictions/us-ct.yaml, WINDOWS.md entry #3) — this is a deliberate
# honesty gate, not a bug, and tests/test_jurisdiction_us_nj.py asserts the
# refusal directly rather than working around it.

jurisdiction:
  id: us-nj
  name: New Jersey
  country_code: US
  level: state
  parent_id: null
  currency: USD
  status: curated_validated
  effective_dates:
    rule_version_effective_from: "2018-07-03"
    rule_version_effective_to: "2021-01-06"
    source_checked_date: "2026-09-09"
  sources:
