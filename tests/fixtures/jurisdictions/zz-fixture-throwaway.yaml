# DELIBERATE THROWAWAY — exists SOLELY to prove JUR-05 (plan 02-06, Task 3).
#
# This is a jurisdiction the engine has never seen, with nothing in common
# with jurisdictions/us-ny.yaml (base total_qualified_spend, rate flat,
# mechanism refundable, currency USD) or jurisdictions/us-ct.yaml (base
# total_qualified_spend, rate tiered_by_spend, mechanism transferable,
# currency USD). It must price correctly with ZERO lines changed in any
# engine/*.py file — that zero-line diff is the proof, recorded verbatim in
# 02-06-SUMMARY.md from `git diff --name-only HEAD~1 HEAD | grep '^engine/'`
# run against the commit that adds this file and its test.
#
# EVERY NUMBER BELOW IS INVENTED. This models NO real jurisdiction, no real
# incentive programme, and must never be cited, extracted into a research
# document, or presented as anything other than a synthetic engine-
# correctness fixture. jurisdiction.status is synthetic_fixture (never any
# curated-data status value) and this file lives under
# tests/fixtures/jurisdictions/, never under jurisdictions/ — the
# directory-hygiene test in tests/test_engine_qualifying_base.py enforces
# both structurally.
#
# Dimensions exercised, deliberately different from both curated files:
#   - base_definition.type: labour_only (neither curated file uses this)
#   - rate_structure.type: blended_by_ceiling_split (neither curated file
#     uses this — us-ny is flat, us-ct is tiered_by_spend)
#   - mechanism: rebate_grant (neither curated file uses this — us-ny is
#     refundable, us-ct is transferable)
#   - currency: CZK (both curated files are USD) — a deliberate callback to
#     feasibility-incentives.md's Czech Republic case study (the reason
#     eligibility and availability are two separate answers, INC-05)
#   - a declared per-person ceiling (applies: true — though price_jurisdiction
#     never threads production-specific per_person_compensations, so the
#     no-op "no compensation lines supplied" branch is what actually runs
#     end-to-end here; the schema field itself is what this dimension proves)
#   - a declared minimum spend, well below the priced production's spend
#   - a per-project cap that actually binds (clips the computed credit)
#   - a declared audit fee schedule (one flat-fee band)
#   - a declared payout lag (display-only, per SCOPE-FREEZE.md item 8)
#   - two programmes with a stacking relationship (stacks_with)
#
# Priced against a total qualified spend of CZK 50,000,000. Expected values
# below (in tests/test_engine_jurisdiction_additivity.py) are computed BY
# HAND from these declared numbers, never by calling the engine on itself:
#
#   primary-throwaway (blended_by_ceiling_split, no pct_core_cap declared):
#     base (labour_only, from_total) = 50,000,000
#     per-person ceiling: applies=true but no compensations supplied by the
#       pipeline -> no-op, base unchanged
#     no uplifts declared -> no-op
#     enhanced_slice = min(50,000,000, 20,000,000) = 20,000,000
#     standard_slice = max(0, 50,000,000 - 20,000,000) = 30,000,000
#     (no pct_cap declared, so neither slice is further capped)
#     enhanced_amount = 20,000,000 x 0.30 = 6,000,000
#     standard_amount = 30,000,000 x 0.20 = 6,000,000
#     gross credit = 12,000,000
#     per-project cap 10,000,000 BINDS (12,000,000 > 10,000,000) -> clipped
#       to 10,000,000
#     annual programme cap: not declared -> no-op, no change
#     gross credit (final) = 10,000,000
#     audit fee: qualifying base 50,000,000 falls in the declared [0, null)
#       band -> deduct flat fee 25,000
#     net cash (rebate_grant) = 10,000,000 - 25,000 = 9,975,000
#
#   secondary-throwaway (flat 0.05, no ceiling/minimum/caps/audit declared):
#     base (labour_only, from_total) = 50,000,000
#     gross credit = 50,000,000 x 0.05 = 2,500,000
#     no audit fee schedule declared -> deduct $0
#     net cash (rebate_grant) = 2,500,000
#
#   No mutual exclusivity declared between the two -> both contribute.
#   Jurisdiction total = 9,975,000 + 2,500,000 = 12,475,000

