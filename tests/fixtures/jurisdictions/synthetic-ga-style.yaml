# SYNTHETIC TEST FIXTURE — NOT A REAL JURISDICTION, NOT A CURATED RULE MODEL.
#
# Georgia is NEVER a curated jurisdiction for this project (per PROJECT.md
# Out of Scope and jurisdictions/SCOPE-FREEZE.md): no per-production
# disclosure exists anywhere for Georgia's film credit, so the validation
# loop this project runs against a government-issued figure cannot close
# for it. This file is purely an engine-correctness regression fixture,
# built from the Georgia worked example in feasibility-incentives.md
# ("Georgia, $10M GA spend including a $2M lead-actor deal") and from
# `.planning/phases/02-engine-spine-incentive-interpreter/02-RESEARCH.md`
# "Pitfall 4" — it proves engine/credit.py's per-person-ceiling step
# reduces the BASE before the rate, distinguishes W-2 from loan-out
# treatment, and selects a withholding rate from a dated schedule rather
# than a scalar.
#
# Every numeric value below is illustrative and made up EXCEPT the
# `loanout_withholding_schedule`, which is copied verbatim from
# `.planning/SOURCE-TRUTH.md` SRC-05 — the Georgia Department of Revenue's
# own published five-year declining schedule, confirmed HIGH confidence
# against a primary source archived under sources/ga/. The flat 30% rate,
# the $500,000 W-2 cap, and the `mechanism: refundable` declaration are all
# illustrative constructs to exercise the engine, not sourced Georgia facts
# — Georgia's real programme is transferable, not refundable, and its real
# per-person cap and rate figures are confirmed in feasibility-incentives.md
# but not re-sourced to a primary document in this session.
#
# `jurisdiction.status` is `synthetic_fixture` (never any curated-data
# status value) and this file lives under `tests/fixtures/jurisdictions/`,
# never under `jurisdictions/` — the directory-hygiene test in
# tests/test_engine_qualifying_base.py enforces both structurally. This
# file must never be presented as, or mistaken for, a curated
# government-sourced rule model.
#
# Every numeric value is a quoted YAML string (RD-01 convention).

