# SYNTHETIC TEST FIXTURE — NOT A REAL JURISDICTION, NOT A CURATED RULE MODEL.
#
# The United Kingdom is NEVER a curated jurisdiction for this project (per
# PROJECT.md Out of Scope and jurisdictions/SCOPE-FREEZE.md): no BFI or
# HMRC publication ties a title to its £ AVEC/IFTC amount — the figure
# lives inside a confidential Corporation Tax computation, so the
# validation loop this project runs against a government-issued figure
# cannot close for the UK. This file is PURELY an engine-correctness
# regression fixture, built from the worked example in
# feasibility-incentives.md ("UK IFTC, £18M film, 100% UK spend") and from
# `.planning/phases/02-engine-spine-incentive-interpreter/02-RESEARCH.md`
# "Pitfall 3" and the recorded decision at the top of
# `02-05-PLAN.md` ("the ceiling split operates on core expenditure, before
# the cap"). It must NEVER be presented as, or mistaken for, a model of the
# UK's actual Independent Film Tax Credit programme — the rate, threshold
# and cap figures below are copied from that one worked example, not
# independently re-verified against HMRC guidance in this session.
#
# £18,000,000 of core expenditure, split at a £15,000,000 enhanced
# ceiling: enhanced slice £15,000,000, standard slice £3,000,000. Each
# slice capped at 80% of itself (£12,000,000 / £2,400,000), each capped
# slice multiplied by its own rate (53% / 34%): £6,360,000 + £816,000 =
# £7,176,000 gross. This is the D-05-adjacent golden value
# tests/test_engine_credit.py asserts, and the £7,632,000 cap-before-split
# figure it explicitly asserts is NOT produced.
#
# `jurisdiction.status` is `synthetic_fixture` (never any curated-data
# status value) and this file lives under `tests/fixtures/jurisdictions/`,
# never under `jurisdictions/` — the directory-hygiene test in
# tests/test_engine_qualifying_base.py enforces both structurally.
#
# Every numeric value is a quoted YAML string (RD-01 convention). Plan
# 02-04 reads this same committed file for the net-cash half of the worked
# example (the taxable mechanism, corporation-tax deduction) and must not
# need to modify it — the mechanism and tax fields below are declared now
# even though this plan (02-05) asserts only the gross figure.

