# SYNTHETIC TEST FIXTURE — NOT A REAL JURISDICTION, NOT A CURATED RULE MODEL.
#
# Illustrative engine-correctness fixture for plan 02-04's four net-cash
# mechanism functions (refundable, rebate_grant, transferable,
# nonrefundable_credit), the cliff-tiered audit fee schedule, and arrival
# timing. The audit fee's top-band amount ($25,000) and the transferable
# discount range (85-92 cents) are copied from feasibility-incentives.md's
# Georgia worked example ("subtract the mandatory audit fee ($25,000 tier)
# and apply the ~85-92 cent transfer discount") — illustrative numbers
# reused for regression testing, NOT independently re-verified against
# Georgia's own statute or a primary audit-fee schedule this session. This
# file must never be presented as a model of any real jurisdiction's
# programme.
#
# jurisdiction.status is synthetic_fixture (never a curated-data status
# value) and this file lives under tests/fixtures/jurisdictions/, never
# under jurisdictions/ — the directory-hygiene test in
# tests/test_engine_qualifying_base.py enforces both structurally.
#
# Every numeric value is a quoted YAML string (RD-01 convention), except
# `int`-typed fields (`payout_lag.typical_days`, `timing.decision_sla_days`),
# which are never Decimal and are therefore never quoted, matching
# engine/models.py's field typing exactly.
#
# All four programmes share one qualified spend ($10,000,000, matching the
# scale of feasibility-incentives.md's Georgia worked example) and the same
# three-band audit fee schedule (boundaries at $5,000,000 and $10,000,000,
# top-band fee $25,000). Each programme's own rate_structure.base_rate
# differs so the four net-cash results are pairwise different by
# construction — never by coincidence, and never because a dispatch bug
# routed every mechanism through the same function.

