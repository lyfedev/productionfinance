# SYNTHETIC TEST FIXTURE — NOT A REAL JURISDICTION, NOT A CURATED RULE MODEL.
#
# Built for plan 02-06 (INC-03's stacking half) to prove the identity model
# a national-plus-regional stack requires: N programmes, each priced
# independently against its own base, with ONLY the resulting dollar
# figures summed — never a summed rate applied to one shared base.
#
# Layout decision (checkpoint:decision, answered by the human 2026-08-25,
# recorded in jurisdictions/SCOPE-FREEZE.md RD-06): `programmes-in-one-file`
# — a regional programme that stacks on a national one lives as a second
# entry in the SAME jurisdiction file's `programmes` list, not as a separate
# file linked by `jurisdiction.parent_id`. Stacking edges (`stacks_with`,
# `mutually_exclusive_with`) below are therefore resolved WITHIN this one
# file; the engine performs no cross-file resolution step.
#
# Three programmes, all illustrative, none sourced to any real government
# disclosure:
#   - `national-base`: flat rate over the full total_qualified_spend base,
#     carrying TWO uplifts (`early-shoot-uplift`, `rural-location-uplift`),
#     both non-stackable — the ordering test in tests/test_engine_credit.py
#     swaps their declared order and asserts the resulting credit changes,
#     proving ordering is read from data, not a code branch.
#     `requires_separate_application: true` at the programme level, so the
#     "still priced, application-requirement recorded" derivation line is
#     also exercised.
#   - `regional-topup`: flat rate over a DIFFERENT, smaller base
#     (`lesser_of_pct_core_or_actual_local` at a 30% cap of core
#     expenditure) — stacks with `national-base`. Summing
#     `national-base` + `regional-topup` as independent dollar outputs
#     gives a different (correct) number than summing their two rates and
#     applying the sum to `national-base`'s own base, which the test
#     computes explicitly and asserts the engine does not produce.
#   - `third-exclusive`: mutually exclusive with `regional-topup`, over the
#     full base at a rate deliberately set BELOW `regional-topup`'s
#     contribution, so `regional-topup` is the one taken and
#     `third-exclusive` is the one recorded-but-excluded — proving the
#     resolution keeps both figures visible rather than silently dropping
#     the untaken one.
#
# All figures below are hand-picked round numbers chosen so the expected
# results can be computed by hand in the test file, never by calling the
# engine on itself. Every numeric value is a quoted YAML string (RD-01).

