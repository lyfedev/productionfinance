assertion:
  mode: bounded
  tolerance_bps: 150
  variance_reason: >
    Implied rate is $35,318,864 / $134,340,015 = 26.29%, a 1.29-point (129bp)
    spread above the clean 25.0% base rate confirmed by Anora and Succession
    S4 in this same disclosure batch. feasibility-incentives.md:266 names
    this exact residue as an unlisted uplift stacked on top of the base
    credit. The ESD "Credits Issued" table's 12 published columns (Qualified
    Costs, NYS Spend, Total Hires, Credit Eligible Hours, Credit Eligible
    Wages, Credit Issued Amount, Diversity Credit Amount) do not include a
    field naming which additional credit was claimed — NY's program has at
    least one documented stackable bonus in this period (e.g. the
    "Production Plus" 5-10% bonus named in feasibility-incentives.md:162) but
    the disclosure does not say whether this production claimed it, claimed a
    different upstate/qualifying uplift, or something else entirely. The
    unobservable is specifically which uplift(s), if any, were stacked on the
    base rate for this production — that is not derivable from the archived
    document, so this cannot be `exact` without the interpreter guessing an
    unstated claim.

notes: >
  This fixture asserts on net cash out (credit_amount) given qualified spend
  in as a given; it carries no production input vector (D-02). assertion.mode
  is deliberately `bounded`, not `exact` (D-04) — see variance_reason for the
  specific unobservable this concedes. tolerance_bps (150) is sized to cover
  the observed 129bp residue plus a small margin, not to reverse-engineer the
  exact uplift mechanism.
