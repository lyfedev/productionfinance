assertion:
  mode: bounded
  tolerance_bps: 200
  variance_reason: >
    disclosure_stage is estimated: the dashboard's own column header is "Est.
    NJ Qualified Film Prod. Expenses After 7/1/18" and "Total Award" — both
    pre-certification figures, not the "Adjusted Certification" column
    ($1,783,375) the same row also carries, which is the later, lower,
    audited-cost-verified amount. This production also carries a "Yes"
    Diversity Bonus flag. Plan 05-05 fully explains the residue rather than
    absorbing it into an arbitrary tolerance: jurisdictions/us-nj.yaml's
    sourced 30% base rate (N.J.A.C. 19:31T-1.6(a)(2), the tier both
    committed New Jersey fixtures need) prices this row's disclosed
    qualified_spend to $1,839,977 — a residue of exactly $122,665 against
    the disclosed $1,962,642 Total Award. That residue equals, to the
    dollar, the sourced 2 percent diversity-plan bonus (N.J.A.C.
    19:31T-1.6(o)(1) and P.L. 2018, c. 56 Section 4a, independently
    confirmed, sources/nj/2026-09-09-njeda-nj-a-c-19-31t-garden-state-film-digital-media-jobs-program.pdf
    and sources/nj/2026-09-09-njleg-pl2018-c56-garden-state-film-digital-media-jobs-act.pdf)
    applied to this row's own disclosed qualified_spend: $6,133,257 x 0.02 =
    $122,665.14, quantized ROUND_HALF_UP to $122,665 — an EXACT Decimal
    equality, asserted (never merely bounded) in
    tests/test_jurisdiction_us_nj.py::test_joker_diversity_bonus_residue_is_exactly_the_sourced_bonus_rate.
    tolerance_bps is set to 200 — exactly the sourced bonus rate expressed
    in basis points (2 percent = 200 bps) — because that is the true,
    fully-explained size of the only residue this pair carries (measured
    at ~199.9998 bps, sub-basis-point rounding noise from two separate
    whole-dollar quantizations); it is not a margin invented to make a
    real modelling gap disappear, and it admits nothing beyond what the
    exact-equality test above already proves by hand.

notes: >
  Re-verified independently this session directly against the live NJEDA
  "Film Tax Credit Activity Report" Power BI dashboard (embedded at
