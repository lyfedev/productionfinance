  both match 01-RESEARCH.md and feasibility-incentives.md exactly — no
  discrepancy for this pair (contrast with nj_trial_of_the_chicago_7.yaml,
  which does carry a $1 discrepancy against the same secondary sources).
  D-02 interpreter-only boundary holds: qualified_spend is fed in as a
  given; no input-vector field is asserted against. diversity_credit_amount
