      source_url: null
      date_checked: "2026-08-26"
      method_note: >
        Standard employer-side payroll tax estimate (FICA 7.65% +
        blended FUTA/SUTA ~2%), never a union-published figure. Identical
        across all four unions in this file (see this file's header
        note).
    other_burden_pct:
      value: "0.02"
      basis: "estimated"
      source_url: null
      date_checked: "2026-08-26"
      method_note: >
        Standard general workers'-compensation/liability burden estimate,
        never a union-published figure. Identical across all four unions
