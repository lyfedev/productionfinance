# data/crew_tiers.yaml — a modelling assumption, NOT a sourced government
# figure (D-38/D-39). Deliberately kept out of jurisdictions/ — that
# directory is reserved for curated rule files reproducing a government
# disclosure, and this table is not one.
#
# Non-union local labour and crew-composition rates are not publicly
# disclosed anywhere (PROJECT.md line 78 — "that is what Entertainment
# Partners and Cast & Crew sell"). These headcount bands are a defensible,
# round, internal estimate informed by typical crew sizes at each
# production scale, not a reproduced figure. This file must never declare
# a `confidence` or `status` key — that vocabulary is reserved for
# jurisdictions/*.yaml rule files reproducing an actual government
# disclosure (RD-02).
#
# Every headcount value below is a quoted YAML string, matching this
# repo's RD-01 convention (jurisdictions/us-ny.yaml header) of never
# letting PyYAML parse a numeric field as a native type the calling code
# then has to re-derive precision from — resolve_crew_tier() converts each
# with int(), never a bare YAML-native int.

basis: modelling_assumption
provenance_note: >
  Non-union local labour and crew-composition rates are not publicly
  disclosed (PROJECT.md line 78). These headcount ranges are an internal
  modelling assumption, not a government-sourced figure, and are labelled
  as such wherever rendered — never as validated, never as sourced.

  Phase 4 plan 04-01 (D-38) adds the `departments:` block below. The
  per-tier department crew-share percentages are industry-commentary
  aggregates (production-budgeting guides and trade-press department-size
  discussions) rather than a primary accounting-standard document
  (04-RESEARCH.md Assumptions Log row A3) — the same modelling_assumption
  basis as the headcount ranges above, never validated, never sourced.

tiers:
  micro:
    headcount_low: "15"
    headcount_high: "30"
  small:
    headcount_low: "30"
    headcount_high: "60"
  mid:
    headcount_low: "60"
    headcount_high: "120"
  large:
    headcount_low: "120"
    headcount_high: "200"
  tentpole:
    headcount_low: "200"
    headcount_high: "400"

# D-38: department ratios, deferred to Phase 4 plan 04-01. Each department
# carries an OUT-04/D-77 chart-of-accounts `account` tag (ATL/BTL/POST)
# and a per-tier `crew_share` — a quoted-string fraction of the tier's
# resolved headcount. Every tier's shares sum to exactly "1"
# (tests/test_engine_budget.py asserts this) — a silent residue would be
# an unpriced department wearing no label. The same percentages are used
# across every tier (a further modelling assumption, not scale-dependent,
# disclosed here rather than left implicit).
#
# No department here carries an ATL tag: this table models below-the-line
# crew composition only (per the file's own header above) — above-the-line
# roles (writer/producer/director/principal cast) are not part of the
# crew-tier headcount this file resolves and are out of scope for this
# department breakdown.
departments:
  production:
    label: "Production labour days"
    account: "BTL"
    crew_share:
