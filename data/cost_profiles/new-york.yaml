# data/cost_profiles/new-york.yaml — New York's committed
# `CityCostProfile` (Phase 4, D-53). A cost profile is a genuinely
# different artifact from a jurisdiction rule file: it prices union
# scale, per diem, housing, stages and equipment for a described
# production, and needs no rule file to exist (D-53's own ARCHITECTURE.md
# citation: stage [2] CityLocalizer is "JURISDICTION-AGNOSTIC"). This
# tracer profile carries exactly ONE cost line — crew labour, estimated
# from data/union_rates/us-ny-crew.yaml (see that file's provenance_note
# for the full disclosed basis and method).
#
# Every numeric value below is a quoted YAML string (RD-01).

city_id: "new-york"
city_label: "New York, NY"
jurisdiction_id: "us-ny"
currency: "USD"
provenance_note: >
  New York's cost profile for Phase 4's tracer slice (plan 04-01). Exactly
  one cost line is committed here — crew labour — estimated from
  data/union_rates/us-ny-crew.yaml. Every other COST_CATEGORIES entry
  (fringe, housing, per_diem, flights, stages, equipment, permits,
  locations, trucking) is unpriced by this profile and is named in the
  Route A response's `not_priced` list, never rendered as a $0 line
  (D-60). Later plans in this phase widen this same profile with more
  cost lines; they do not change its shape.

cost_lines:
  - line_id: "ny-crew-labour"
    label: "Crew labour days"
    category: "labour"
    account: "BTL"
    spend_class: "local_labour"
    unit_rate: "450.00"
    rate_unit: "person-day"
    basis: "estimated"
    source_url: null
    date_checked: null
    method_note: >
      Estimated New York production crew day rate — see
      data/union_rates/us-ny-crew.yaml's provenance_note for the full
      disclosed method and why this is not tagged sourced.
