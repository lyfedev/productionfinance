# data/cost_profiles/us-ca-los-angeles.yaml — Los Angeles's committed
# `CityCostProfile` (Phase 4, plan 04-02, D-53/D-54). This is the second
# committed cost profile, and the demonstration D-53 exists to make: Los
# Angeles has a FULL cost profile and NO jurisdiction rule file
# (`jurisdiction_id: null`) — California's rule file is Phase 5's work
# (JUR-02), not this one's. Cost localization needs nothing from a rule
# file (ARCHITECTURE.md Q1: stage [2] CityLocalizer is
# "JURISDICTION-AGNOSTIC (this is cost, not incentive rules)"), so Los
# Angeles prices exactly like New York, one committed profile ahead of
# its incentive side.
#
# Same shape as data/cost_profiles/us-ny-new-york.yaml: ten labour cost
# lines, one per crew_tiers.yaml department, each priced dynamically
# through the `labour:` block below. `region: "us-ca"` selects Los
# Angeles's own dated rows from data/union_rates/iatse.yaml — the camera
# department's craft ("camera") resolves to a genuinely `basis: sourced`
# IATSE Local 600 Western Region rate row (two adjacent dated windows,
# 2025-08-03 through 2027-07-31); every other department's craft
# ("general_crew") resolves to a `basis: estimated` row, carrying the same
# disclosed New York estimate pending a Los-Angeles-specific primary
# source (see data/union_rates/iatse.yaml's header and
# .planning/WINDOWS.md).
#
# Plan 04-04 (COST-06/INC-10) adds `facilities_id` and five more cost
# lines (stages, equipment, permits, locations, trucking), priced
# dynamically from the shoot calendar's day counts via
# data/facilities/us-ca-los-angeles.yaml — every entry there is
# `basis: modelling_assumption` (COST-06: never sourced). `not_priced` is
# now empty for this profile. `exemptions_id` adds one stackable hotel-
# occupancy cost reduction against the Housing line
# (data/tax_exemptions/us-ca-los-angeles.yaml, `basis: estimated`) — a
# cost-side reduction only, never touching the incentive figure (D-76).
#
# Every numeric value below is a quoted YAML string (RD-01).

city_id: "us-ca-los-angeles"
city_label: "Los Angeles, CA"
jurisdiction_id: null
currency: "USD"
facilities_id: "us-ca-los-angeles"
exemptions_id: "us-ca-los-angeles"
provenance_note: >
  Los Angeles's cost profile. `jurisdiction_id` is null because Phase 4
  builds cost profiles for cities whose rule files do not yet exist
  (D-53) — California's curated jurisdiction rule file (rate, caps,
  mechanism, audit) is Phase 5's work (JUR-02), not this plan's. This is
  a deliberate proof, not a gap: Los Angeles prices its full landed cost
  here with no incentive term yet modelled, and `app/services/spec.py`
  reports `incentive_state: "not_modelled"` with a plain-words reason for
  it, never a fabricated $0 incentive (D-56). Ten labour cost lines are
  committed here — one per crew department, matching
  engine/budget.py::resolve_departments' D-38 decomposition — each priced
  dynamically through the `labour:` block below. The camera department is
  genuinely `basis: sourced` from IATSE Local 600's own published Western
  Region rate cards (two adjacent dated windows); every other department
  is `basis: estimated` pending per-craft primary-source acquisition
  (.planning/WINDOWS.md). Plan 04-03 (COST-04/COST-05) adds housing,
  per_diem and flights, priced dynamically from imported crew and imported
  principal cast headcount only, against the committed Los Angeles County
  GSA per-diem snapshot — genuinely flat all year for FY2026 (D-64), a
  stated absence rather than a backfilled seasonal swing. Plan 04-04 adds
  the five facilities categories (stages, equipment, permits, locations,
  trucking), every one `basis: modelling_assumption` (COST-06), plus one
  stackable hotel-occupancy exemption against the Housing line (INC-10).
  Every COST_CATEGORIES entry is now priced by this profile —
  `not_priced` is empty.

labour:
  region: "us-ca"
  crafts:
    production:
      union: "IATSE"
      craft: "general_crew"
    camera:
      union: "IATSE"
      craft: "camera"
    grip_and_electric:
      union: "IATSE"
      craft: "general_crew"
    art:
      union: "IATSE"
      craft: "general_crew"
    wardrobe:
      union: "IATSE"
      craft: "general_crew"
    hair_and_makeup:
      union: "IATSE"
      craft: "general_crew"
    sound:
      union: "IATSE"
      craft: "general_crew"
    transportation:
      union: "IATSE"
      craft: "general_crew"
    locations:
      union: "IATSE"
      craft: "general_crew"
    post:
      union: "IATSE"
      craft: "general_crew"

travel:
  per_diem_id: "us-ca-los-angeles-county"
  flight_round_trip_rate: "450"
  basis: "estimated"
  source_url: null
  date_checked: null
  method_note: >
    The same national-average round-trip domestic economy airfare figure
    used for New York (no per-route or per-city published fare table
    located this session) — disclosed as a modelling estimate, not a
    specific route's published fare (04-RESEARCH.md Assumption A5's
    sourcing tier).
  housing_uplift_note: >
    Housing for imported crew and cast is priced at exactly the committed
    per-diem table's lodging component — no additional negotiated-rate
    uplift is modelled. A negotiated hotel rate stays in
    PERMANENT_EXCLUSIONS (D-60) and is never fabricated here.

