<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ProductionFinance{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    table { border-collapse: collapse; margin: 0.5rem 0; }
    td, th { border: 1px solid #ccc; padding: 0.35rem 0.6rem; text-align: left; }
    .figure-node { margin-left: 1.25rem; border-left: 2px solid #ddd; padding-left: 0.75rem; }
    .unselectable { color: #777; }
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
