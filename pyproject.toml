[project]
name = "productionfinance"
version = "0.1.0"
description = "Total landed cost of one identical production, priced per city, with every figure sourced, dated, and provably matching what a government actually paid."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "jinja2>=3.1.6",
    "pydantic>=2",
    "python-multipart>=0.0.32",
    "pyyaml==6.0.3",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "engine"]
